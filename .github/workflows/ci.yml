name: CI
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run uv build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run ruff check
        run: uv run ruff check
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run mypy
        run: uv run mypy --package workflows_playground
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run pytest
        run: uv run coverage run --parallel-mode -m pytest tests
      - name: Archive a coverage file
        run: tar -cf "$RUNNER_TEMP/coverage.tar" .coverage.*
      - uses: actions/upload-artifact@v4
        with:
          name: coverage.${{ strategy.job-index }}
          path: ${{ runner.temp }}/coverage.tar
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage.*
          path: ${{ runner.temp }}
      - run: find "$RUNNER_TEMP" -maxdepth 2 -mindepth 2 -type f | sort
      - name: Extract coverage files
        run: find "$RUNNER_TEMP"/coverage.* -maxdepth 1 -type f -name coverage.tar -exec tar -xf {} \;
      - run: find . -maxdepth 1 -mindepth 1 -type f | sort
      - name: Run coverage combine
        run: uv run coverage combine
      - name: Run coverage report
        run: |
          uv run coverage report --format=markdown -m |& tee -a "$GITHUB_STEP_SUMMARY"
          uv run coverage html
      - uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run mkdocs build
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
  publish:
    needs: [ build, lint, typing, coverage, docs ]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run uv publish
        run: uv publish
