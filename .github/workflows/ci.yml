name: "Install latest LXD"
on: push
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - uses: canonical/setup-lxd@v0.1.3
      - run: sudo lxc init ubuntu:24.04 u1
      - run: sudo lxc config set u1 security.nesting=true
      - run: sudo lxc start u1
      - run: sudo lxc exec u1 -- su - -c 'apt-get update && apt-get -y install curl ca-certificates && apt-get -y upgrade'
      - run: sudo lxc exec u1 -- su - -c 'curl -fL https://get.docker.com | sh'
      - run: sudo lxc exec u1 -- su - -c 'docker run --rm hello-world'
