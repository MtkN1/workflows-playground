name: CI
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run uv build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run ruff check
        run: uv run ruff check
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run mypy
        run: mypy --package workflows_playground
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run pytest
        run: uv run pytest --cov --cov-report=term-missing tests
      - name: Run mv .coverage
        run: mv .coverage .coverage.${{ matrix.os }}.${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.${{ matrix.os }}.${{ matrix.python-version }}
          include-hidden-files: true
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage*
          merge-multiple: true
      - name: Run coverage combine
        run: uv run coverage combine
      - name: Run coverage report
        run: |
          uv run coverage report --format=markdown -m |& tee -a "$GITHUB_STEP_SUMMARY"
          uv run coverage html
      - uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run mkdocs build
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run uv publish
        run: uv publish
