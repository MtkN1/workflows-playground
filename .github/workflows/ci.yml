name: CI
on: 
  push:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: ["red", "green", "blue"]
    steps:
      - run: echo date > color.${{ matrix.color }}
      - run: tar -cf color.${{ matrix.color }}.tar.gz color.${{ matrix.color }}
      - uses: actions/upload-artifact@v4
        with:
          name: color.${{ matrix.color }}
          path: color.${{ matrix.color }}.tar.gz
  donwload:
    runs-on: ubuntu-latest
    needs: ["upload"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: color.*
      - run: tree -a
