name: "Install latest LXD"
on: push
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - uses: canonical/setup-lxd@v0.1.3
      - run: lxd init --minimal
      - run: lxc init ubuntu:24.04 u1
      - run: lxc config set u1 security.nesting=true
      - run: lxc start u1
      - run: lxc exec u1 -- su - -c 'apt-get update && apt-get -y install curl ca-certificates && apt-get -y upgrade'
      - run: lxc exec u1 -- su - -c 'curl -fL https://get.docker.com | sh'
      - run: lxc exec u1 -- su - -c 'docker run --rm hello-world'
