name: CI
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: canonical/setup-lxd@v0.1.3
      - run: |
          set -x
          lxc init ubuntu:24.04 ubuntu
          lxc config set ubuntu security.nesting=true
          lxc start ubuntu
          lxc exec ubuntu -- su - -c 'cloud-init status --wait'
          lxc exec ubuntu -- su - -c 'curl -fL https://get.docker.com | sh'
          lxc exec ubuntu -- su - -c 'usermod -aG docker ubuntu'
          lxc exec ubuntu -- su - ubuntu -c 'docker run --rm hello-world'
