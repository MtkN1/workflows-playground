name: "Install latest LXD"
on: push
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      # - run: sudo snap install lxd
      - uses: canonical/setup-lxd@main
        with:
          preseed: |
            networks:
            - name: lxdbr0
              type: bridge
              config:
                ipv4.address: auto
                ipv6.address: none
      - run: sudo lxc init ubuntu:24.04 u1
      - run: sudo lxc config set u1 security.nesting=true
      - run: sudo lxc start u1
      - run: sudo lxc exec u1 -- su - -c 'tail /etc/passwd'
      - run: sudo lxc exec u1 -- su - -c 'curl -fL https://get.docker.com | sh'
      - run: sudo lxc exec u1 -- su - -c 'sudo usermod -aG docker $USER'
      - run: sudo lxc exec u1 -- su - -c 'docker run --rm hello-world'
