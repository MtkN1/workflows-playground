name: CI
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          activate-environment: "true"
      - name: platform
        shell: python
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
        run: |
          import os
          import platform
          github_step_summary = os.environ["GITHUB_STEP_SUMMARY"]
          matrix_runner = os.environ["MATRIX_RUNNER"]
          with open(github_step_summary, "a", encoding="utf-8") as f:
            lines = [
              f"## {matrix_runner}\n",
              f"- `{platform.architecture()=}`\n",
              f"- `{platform.machine()=}`\n",
              f"- `{platform.node()=}`\n",
              f"- `{platform.platform()=}`\n",
              f"- `{platform.platform(aliased=True)=}`\n",
              f"- `{platform.platform(terse=True)=}`\n",
              f"- `{platform.processor()=}`\n",
              f"- `{platform.python_build()=}`\n",
              f"- `{platform.python_compiler()=}`\n",
              f"- `{platform.python_branch()=}`\n",
              f"- `{platform.python_implementation()=}`\n",
              f"- `{platform.python_revision()=}`\n",
              f"- `{platform.python_version()=}`\n",
              f"- `{platform.python_version_tuple()=}`\n",
              f"- `{platform.release()=}`\n",
              f"- `{platform.system()=}`\n",
              f"- `{platform.version()=}`\n",
              f"- `{platform.uname()=}`\n",
            ]
            f.writelines(lines)
